<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1f4e79">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Царинска фактура</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-title">Царинска фактура</div>
        <button class="btn small on-dark" id="reset" type="button">Исчисти</button>
    </header>

    <div class="mode-bar">
        <div class="seg" id="mode-seg">
            <button data-mode="edit" class="active">✎ Уреди</button>
            <button data-mode="preview">👁 Преглед</button>
        </div>
    </div>

    <main id="app">
        <!-- ============ УРЕДИ ============ -->
        <section id="view-edit">
            <div class="seg" id="type-seg">
                <button data-type="out" class="active">↗ Излезна</button>
                <button data-type="in">↙ Влезна</button>
            </div>
            <p class="hint" id="type-hint"></p>

            <div class="card party" data-side="from">
                <h2>Од — издавач</h2>
                <select class="party-select"></select>
                <details class="party-details">
                    <summary class="party-summary"></summary>
                    <div class="party-fields"></div>
                </details>
            </div>

            <div class="swap-row">
                <button class="btn ghost small" id="swap-parties" type="button">⇅ Замени ги местата</button>
            </div>

            <div class="card party" data-side="to">
                <h2>До — примач</h2>
                <select class="party-select"></select>
                <details class="party-details">
                    <summary class="party-summary"></summary>
                    <div class="party-fields"></div>
                </details>
            </div>

            <div class="card">
                <h2>Фактура</h2>
                <div class="grid2">
                    <label class="field"><span>Број</span><input id="f-number" autocomplete="off" placeholder="пр. 001/2026"></label>
                    <label class="field"><span>Место</span><input id="f-place" autocomplete="off"></label>
                    <label class="field"><span>Датум</span><input id="f-date" type="date"></label>
                    <label class="field"><span>Валута (рок)</span><input id="f-due" type="date"></label>
                </div>
            </div>

            <details class="card" open>
                <summary><h2>Царински податоци</h2></summary>
                <div class="grid2">
                    <label class="field"><span>Постапка</span>
                        <select id="c-regime">
                            <option>Увоз</option>
                            <option>Извоз</option>
                            <option>Транзит</option>
                            <option>Привремен увоз</option>
                            <option>Реекспорт</option>
                            <option>Друго</option>
                        </select>
                    </label>
                    <label class="field"><span>Царинарница</span><input id="c-office" list="offices" autocomplete="off"></label>
                    <label class="field"><span>ЕЦД / MRN бр.</span><input id="c-decl" autocomplete="off"></label>
                    <label class="field"><span>Датум на ЕЦД</span><input id="c-decl-date" type="date"></label>
                    <label class="field"><span>Возило (рег. бр.)</span><input id="c-vehicle" autocomplete="off"></label>
                    <label class="field"><span>Фактура за стока бр.</span><input id="c-goods-inv" autocomplete="off"></label>
                    <label class="field full"><span>Опис на стоката</span><input id="c-goods" autocomplete="off"></label>
                    <label class="field"><span>Тарифен број</span><input id="c-tariff" inputmode="numeric" autocomplete="off"></label>
                    <label class="field"><span>Колети</span><input id="c-packages" type="number" inputmode="numeric"></label>
                    <label class="field"><span>Бруто (кг)</span><input id="c-gross" type="number" inputmode="decimal" step="0.01"></label>
                    <label class="field"><span>Нето (кг)</span><input id="c-net" type="number" inputmode="decimal" step="0.01"></label>
                    <label class="field"><span>Вредност на стока</span><input id="c-value" type="number" inputmode="decimal" step="0.01"></label>
                    <label class="field"><span>Валута на стока</span>
                        <select id="c-currency"><option>EUR</option><option>МКД</option><option>USD</option><option>CHF</option><option>GBP</option></select>
                    </label>
                </div>
            </details>

            <div class="card">
                <div class="card-head">
                    <h2>Услуги / ставки</h2>
                    <button class="btn ghost small" id="from-catalog" type="button">☰ Ценовник</button>
                </div>
                <div id="items"></div>
                <button class="btn outline block" id="add-item" type="button">+ Додади ставка</button>
            </div>

            <div class="card">
                <h2>Забелешка</h2>
                <textarea id="f-note" rows="3"></textarea>
            </div>

            <div class="totals-preview" id="totals-preview"></div>
        </section>

        <!-- ============ ПРЕГЛЕД ============ -->
        <section id="view-preview" hidden>
            <div class="sheet-scaler" id="sheet-scaler"><div id="sheet-host"></div></div>
            <button class="btn outline block print-btn" id="print" type="button">🖨 Печати</button>
        </section>
    </main>

    <nav class="export-bar">
        <span class="export-label">Извези:</span>
        <button class="btn primary" data-export="pdf">PDF</button>
        <button class="btn word" data-export="docx">Word</button>
        <button class="btn excel" data-export="xlsx">Excel</button>
    </nav>

    <datalist id="offices">
        <option>ЦИ Скопје</option>
        <option>ЦИ Табановце</option>
        <option>ЦИ Богородица</option>
        <option>ЦИ Деве Баир</option>
        <option>ЦИ Блаце</option>
        <option>ЦИ Ќафасан</option>
        <option>ЦИ Меџитлија</option>
        <option>ЦИ Делчево</option>
        <option>ЦИ Ново Село</option>
        <option>ЦИ Стар Дојран</option>
        <option>ЦИ Аеродром Скопје</option>
        <option>ЦИ Битола</option>
        <option>ЦИ Штип</option>
        <option>ЦИ Куманово</option>
        <option>ЦИ Струмица</option>
        <option>ЦИ Гевгелија</option>
        <option>ЦИ Тетово</option>
        <option>ЦИ Велес</option>
    </datalist>
    <datalist id="service-names"></datalist>

    <dialog class="sheet-dialog" id="catalog-dialog">
        <div class="dialog-head"><h3>Избери од ценовник</h3><button class="icon-btn" id="catalog-close" aria-label="Затвори">✕</button></div>
        <div class="dialog-body" id="catalog-body"></div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="js/data.js"></script>
    <script src="js/words.js"></script>
    <script src="js/sheet.js"></script>
    <script src="js/export.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
